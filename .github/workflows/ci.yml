name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 ships git 2.34, which lacks `merge-tree --write-tree`
        # (needs 2.38) — it exercises the temp-worktree fallback path.
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Toolchain versions
        # locale 决定 bash 的 ${#s} 计数口径（Git Bash 默认 C locale 按字节），出问题要看得见
        run: node --version && git --version && locale | head -3
      - name: End-to-end tests
        run: |
          set -o pipefail
          bash tests/agent/agentctl-test.sh 2>&1 | tee .test-output.log
      - name: Surface failures as annotations
        # job 日志在网页上要求登录才能读；annotation 走公开 API（check-runs）即可读，
        # 让无法本地复现的平台（如 Windows）失败时不用登录也能看到具体是哪条断言。
        # 详情行（缩进 5 空格）与 FAIL 行一起发；测试侧已把详情折成单行，保证不被截断。
        if: failure()
        run: |
          lines="$(grep -E '^(FAIL |通过 |     )' .test-output.log | head -9 || tail -10 .test-output.log)"
          printf '%s\n' "$lines" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
